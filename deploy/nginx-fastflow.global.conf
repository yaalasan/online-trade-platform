# fastflow.global — TEMPLATE server block for the v2 (Postgres) app.
# Proxies to the NEW service on 127.0.0.1:8001. Reuses the EXISTING TLS cert.
# Confirm [CONFIRM] values against the Part 1 preflight before use.
#
# IMPORTANT: security headers (CSP incl. `media-src 'self' https:` for R2, HSTS,
# X-Frame-Options, etc.) are emitted by the Flask app, not here. Do NOT add a CSP
# here and do NOT strip response headers, or you will clobber the app's policy.
#
# Rollback = restore the previous server block (saved in Part 6) and reload.

server {
    listen 80;
    listen [::]:80;
    server_name fastflow.global www.fastflow.global;
    # Keep ACME webroot working if present; otherwise redirect to HTTPS.
    location / { return 301 https://fastflow.global$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fastflow.global www.fastflow.global;

    # [CONFIRM] existing cert paths from preflight (ls /etc/letsencrypt/live/)
    ssl_certificate     /etc/letsencrypt/live/fastflow.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fastflow.global/privkey.pem;

    # Redirect the www apex to the bare host (app resolves only the apex).
    if ($host = www.fastflow.global) { return 301 https://fastflow.global$request_uri; }

    location /static/ {
        # [CONFIRM] new code dir
        alias /opt/fastflow-v2/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;   # NEW app port
        proxy_set_header Host $host;                       # app resolves tenant from Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;        # ProxyFix trusts one hop
        proxy_redirect off;
    }
}
